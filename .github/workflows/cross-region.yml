name: Cross-region / Cross-cluster Astrometry
on:
  push:
    branches: [main]
    paths:
      - stellarweave/survey_validation.py
      - stellarweave/survey_cli.py
      - stellarweave/robust_plate.py
      - stellarweave/download_acsggct.py
      - stellarweave/catalog.py
      - .github/workflows/cross-region.yml
      - stellarweave/result_visualization.py
      - stellarweave/epoch_audit.py
      - stellarweave/spatial_prf.py
      - stellarweave/prf_visualization.py
      - stellarweave/prf_stratification.py
      - stellarweave/prf_stratification_summary.py
      - stellarweave/real_injection.py
      - stellarweave/injection_results.py
      - stellarweave/psf_spatial.py
      - stellarweave/psf_results.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heldout-mosaic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cluster: [ngc6397, ngc6752, ngc0104]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install astronomy dependencies
        run: python -m pip install -r requirements.txt
      - name: Download official ACSGGCT F606W + two-band catalog
        run: |
          python -m stellarweave.download_acsggct --cluster ${{ matrix.cluster }} \
            --band f606w --out data/raw --max-mb 250
      - name: Nine physically disjoint tiles, fixed central anchor
        env:
          TARGET_CLUSTER: ${{ matrix.cluster }}
        run: |
          python -m stellarweave.survey_cli \
            --fits data/raw/${{ matrix.cluster }}/hlsp_acsggct_hst_acs-wfc_${{ matrix.cluster }}_f606w_v2_img.fits \
            --catalog data/raw/${{ matrix.cluster }}/hlsp_acsggct_hst_acs-wfc_${{ matrix.cluster }}_r.rdviq.cal.adj.zpt \
            --cluster ${{ matrix.cluster }} \
            --tile-size 512 --grid 3 --seed 42 \
            --out outputs/cross_region_${{ matrix.cluster }}
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=os.environ['TARGET_CLUSTER']
          p=Path('outputs')/f'cross_region_{c}'/'cross_region.json'
          report=json.loads(p.read_text())
          assert report['tile_count']==9
          assert report['transfer_tiles_total']==8
          assert report['heldout_tiles_physically_nonoverlapping']
          assert report['transform_frozen_on_heldout_regions']
          assert report['science_calibrated'] is False
          assert report['anchor_status']=='HELDOUT_QC_PASS', 'Anchor failed QC'
          assert report['transfer_tiles_pass']>=6, 'Spatial transfer regressed'
          print('Independent spatial transfer statistics:')
          print(json.dumps({
              'cluster':c,'catalog_rows':report['catalog_rows'],
              'anchor':report['anchor_status'],
              'passed_tiles':report['transfer_tiles_pass'],
              'tested_tiles':report['transfer_tiles_total'],
              'failed_regions':report['failed_transfer_tiles']},
              indent=2))
          PY
      - name: Inventory real HST mosaic observation-time metadata
        run: |
          python -m stellarweave.epoch_audit             --fits data/raw/${{ matrix.cluster }}/hlsp_acsggct_hst_acs-wfc_${{ matrix.cluster }}_f606w_v2_img.fits             --out outputs/cross_region_${{ matrix.cluster }}/epoch_audit.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          cluster=os.environ['TARGET_CLUSTER']
          p=Path('outputs')/f'cross_region_{cluster}'/'epoch_audit.json'
          result=json.loads(p.read_text())
          assert result['effective_mosaic_epoch_verified'] is False
          assert result['gaia_epoch_can_be_inferred_automatically'] is False
          PY
        env:
          TARGET_CLUSTER: ${{ matrix.cluster }}
      - name: Nine-tile real HST empirical PSF diagnostics
        env:
          TARGET_CLUSTER: ${{ matrix.cluster }}
        run: |
          python -m stellarweave.psf_spatial \
            --fits data/raw/${{ matrix.cluster }}/hlsp_acsggct_hst_acs-wfc_${{ matrix.cluster }}_f606w_v2_img.fits \
            --plate-report outputs/cross_region_${{ matrix.cluster }}/cross_region.json \
            --out outputs/cross_region_${{ matrix.cluster }} --min-stars 8
          python - <<'PY'
          import json,os
          from pathlib import Path
          cluster=os.environ['TARGET_CLUSTER']
          out=Path('outputs')/f'cross_region_{cluster}'
          d=json.loads((out/'psf_spatial.json').read_text())
          assert d['tile_count']==9 and len(d['tiles'])==9
          assert d['native_pixel_psf_not_oversampled_ePSF'] is True
          assert d['not_calibrated_photometry'] is True
          assert d['usable_tiles']+d['failed_tiles']==9
          assert (out/'psf_montage.png').stat().st_size>8000
          PY
      - name: Cross-validate spatial native-pixel PRF on real HST stars
        env:
          TARGET_CLUSTER: ${{ matrix.cluster }}
        run: |
          python -m stellarweave.spatial_prf \
            --fits data/raw/${{ matrix.cluster }}/hlsp_acsggct_hst_acs-wfc_${{ matrix.cluster }}_f606w_v2_img.fits \
            --plate-report outputs/cross_region_${{ matrix.cluster }}/cross_region.json \
            --cluster ${{ matrix.cluster }} --seed 42 \
            --out outputs/cross_region_${{ matrix.cluster }}
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=os.environ['TARGET_CLUSTER']
          root=Path('outputs')/f'cross_region_{c}'
          d=json.loads((root/'spatial_prf.json').read_text())
          assert len(d['tiles'])==9
          assert d['science_calibrated'] is False
          assert d['oversampled_instrument_epsf'] is False
          assert d['no_heldout_star_used_to_fit_a_scored_template'] is True
          assert (root/'spatial_prf_templates.png').stat().st_size>1000
          assert (root/'heldout_stars.csv').stat().st_size>20
          print('All evaluated/failed tiles retained; shape error is NOT photometric accuracy')
          PY
      - name: Audit frozen HST PRF test stars by brightness and detected-neighbor proxies
        env:
          TARGET_CLUSTER: ${{ matrix.cluster }}
        run: |
          python -m stellarweave.prf_stratification \
            --fits data/raw/${{ matrix.cluster }}/hlsp_acsggct_hst_acs-wfc_${{ matrix.cluster }}_f606w_v2_img.fits \
            --plate-report outputs/cross_region_${{ matrix.cluster }}/cross_region.json \
            --prf-report outputs/cross_region_${{ matrix.cluster }}/spatial_prf.json \
            --cluster ${{ matrix.cluster }} \
            --out outputs/cross_region_${{ matrix.cluster }}
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=os.environ['TARGET_CLUSTER']
          root=Path('outputs')/f'cross_region_{c}'
          d=json.loads((root/'prf_stratification.json').read_text())
          old=json.loads((root/'spatial_prf.json').read_text())
          expected=sum(x['heldout_stars'] for x in old['tiles'] if x['index']!=4)
          assert d['all_original_outer_heldout_stars']==expected
          assert d['models_retrained'] is False
          assert d['stars_removed_for_stratification'] is False
          assert d['science_calibrated'] is False
          assert len(d['tiles'])==8
          print('All frozen held-out sources retained, no refitting')
          PY
      - name: Run one-at-a-time known-flux planted stars in actual HST backgrounds
        env:
          TARGET_CLUSTER: ${{ matrix.cluster }}
        run: |
          python -m stellarweave.real_injection \
            --fits data/raw/${{ matrix.cluster }}/hlsp_acsggct_hst_acs-wfc_${{ matrix.cluster }}_f606w_v2_img.fits \
            --plate-report outputs/cross_region_${{ matrix.cluster }}/cross_region.json \
            --prf-report outputs/cross_region_${{ matrix.cluster }}/spatial_prf.json \
            --cluster ${{ matrix.cluster }} --seed 42 \
            --out outputs/cross_region_${{ matrix.cluster }}
          python - <<'PY'
          import json,os
          from pathlib import Path
          c=os.environ['TARGET_CLUSTER']
          p=Path('outputs')/f'cross_region_{c}'/'artificial_stars.json'
          d=json.loads(p.read_text())
          assert d['total_attempted']==len(d['trials'])
          assert d['total_attempted']>0, 'No injection trials ran'
          assert d['total_recovered']==sum(x['detected'] for x in d['trials'])
          assert d['science_calibrated'] is False
          assert d['models_fitted_on_injection_sources'] is False
          assert d['matched_source_position_known_for_forced_flux'] is True
          assert len(d['groups'])==6
          print('Actual HST injected-star trials checked without selection bias')
          PY
      - name: Upload machine-readable evaluation, no original FITS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-transfer-${{ matrix.cluster }}
          path: |
            outputs/cross_region_${{ matrix.cluster }}/cross_region.json
            outputs/cross_region_${{ matrix.cluster }}/cross_region.csv
            outputs/cross_region_${{ matrix.cluster }}/epoch_audit.json
            outputs/cross_region_${{ matrix.cluster }}/psf_spatial.json
            outputs/cross_region_${{ matrix.cluster }}/psf_spatial.csv
            outputs/cross_region_${{ matrix.cluster }}/psf_montage.png
            outputs/cross_region_${{ matrix.cluster }}/tile_*_native_psf.npy
            outputs/cross_region_${{ matrix.cluster }}/spatial_prf.json
            outputs/cross_region_${{ matrix.cluster }}/heldout_stars.csv
            outputs/cross_region_${{ matrix.cluster }}/spatial_prf_templates.png
            outputs/cross_region_${{ matrix.cluster }}/prf_stratification.json
            outputs/cross_region_${{ matrix.cluster }}/prf_stratification.csv
            outputs/cross_region_${{ matrix.cluster }}/artificial_stars.json
            outputs/cross_region_${{ matrix.cluster }}/artificial_stars.csv
          if-no-files-found: ignore
          retention-days: 30

  three-cluster-summary:
    needs: heldout-mosaic
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - name: Install plotting and testing dependencies
        run: python -m pip install -r requirements-smoke.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: spatial-transfer-*
          path: combined
      - name: Aggregate without cherry-picking failed tiles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots=sorted(Path('combined').rglob('cross_region.json'))
          assert len(roots)==3, f'Expected 3 cluster artifacts, got {len(roots)}'
          reports=[json.loads(p.read_text()) for p in roots]
          names={r['cluster'] for r in reports}
          assert names=={'ngc6397','ngc6752','ngc0104'}
          total=sum(r['transfer_tiles_total'] for r in reports)
          success=sum(r['transfer_tiles_pass'] for r in reports)
          anchors=sum(r['anchor_status']=='HELDOUT_QC_PASS' for r in reports)
          assert total==24
          assert success>=18
          assert anchors==3
          summary={
              'version':'0.9.0','scientific_astrometry_calibrated':False,
              'clusters':[{ 'cluster':r['cluster'],
                          'catalog_rows':r['catalog_rows'],
                          'anchor_status':r['anchor_status'],
                          'passed':r['transfer_tiles_pass'],
                          'tested':r['transfer_tiles_total'],
                          'failed':r['failed_transfer_tiles']}
                          for r in reports],
              'anchor_passed':anchors,'anchor_total':3,
              'region_passed':success,'region_total':total,
              'design':'Disjoint WCS-footprint-centered tiles; fit center only; evaluate frozen transform in eight test tiles per independently fitted cluster'
          }
          Path('cross_cluster_summary.json').write_text(
              json.dumps(summary,indent=2))
          rows=['## Three-cluster spatial transfer (NOT absolute astrometry)',
                '| Cluster | Anchor | Passed regions |',
                '|:--|:--|--:|']
          for r in reports:
              rows.append(f"| {r['cluster']} | {r['anchor_status']} | {r['transfer_tiles_pass']}/{r['transfer_tiles_total']} |")
          rows += [f'**Total: {success}/{total} disjoint transfer tiles.**',
                   'All inputs are NASA/STScI HST archival images and survey-derived catalogs.',
                   'This does not certify external absolute astrometry, completeness or calibrated flux.']
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('\n'.join(rows)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Render scientific plots from ALL real-HST reports
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m stellarweave.result_visualization             combined/spatial-transfer-*/cross_region.json             --out docs/results/real_hst_v09             --source-run-id "$SOURCE_RUN_ID"             --source-commit "$SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/results/real_hst_v09/summary.json').read_text())
          assert d['heldout_regions_total']==24
          assert d['heldout_regions_passed']>=18
          assert len(d['per_tile'])==24
          assert d['not_external_gaia_validation'] is True
          for f in ['spatial_residuals.png','spatial_match_fraction.png',
                    'catalog_source_counts.png']:
              assert (Path('docs/results/real_hst_v09')/f).stat().st_size>8000
          print('Verified README plots generated from unfiltered real observations')
          PY
      - name: Render real-HST spatial PSF figures and preserve raw tiles
        run: |
          python -m stellarweave.psf_results \
            --psf-reports combined/spatial-transfer-*/psf_spatial.json \
            --plate-reports combined/spatial-transfer-*/cross_region.json \
            --out docs/results/real_hst_v12
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/results/real_hst_v12')
          d=json.loads((root/'summary.json').read_text())
          assert d['total_tiles']==27 and len(d['per_tile'])==27
          assert d['not_oversampled_ePSF'] is True
          assert d['not_calibrated_photometry'] is True
          for name in ('psf_spatial_r50.png','psf_spatial_mismatch.png'):
              assert (root/name).stat().st_size>8000
          for cluster in ('ngc6397','ngc6752','ngc0104'):
              assert (root/f'{cluster}_psf_montage.png').stat().st_size>8000
          PY
      - name: Aggregate all three real PRF cross-validations and draw README plots
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m stellarweave.prf_visualization \
            combined/spatial-transfer-*/spatial_prf.json \
            --out docs/results/real_prf_v12 \
            --run-id "$SOURCE_RUN_ID" --source-commit "$SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/results/real_prf_v12')
          d=json.loads((root/'summary.json').read_text())
          assert d['heldout_tile_slots']==24
          assert len(d['clusters'])==3
          assert d['calibrated_photometry'] is False
          assert d['all_failed_tiles_retained'] is True
          for f in ('prf_tile_gains.png','prf_heldout_comparison.png'):
              assert (root/f).stat().st_size>8000
          PY
      - name: Publish complete three-cluster frozen PRF proxy strata and figures
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m stellarweave.prf_stratification_summary \
            --strat-reports combined/spatial-transfer-*/prf_stratification.json \
            --prf-reports combined/spatial-transfer-*/spatial_prf.json \
            --out docs/results/real_prf_v13 \
            --run-id "$SOURCE_RUN_ID" --source-commit "$SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/results/real_prf_v13')
          d=json.loads((root/'summary.json').read_text())
          assert d['total_original_outer_heldout_stars']>0
          assert len(d['groups'])==24
          assert d['all_frozen_test_stars_retained'] is True
          assert d['causal_inference_supported'] is False
          for name in ('stratified_prf_gains.png','ngc0104_failure_map.png','ngc0104_proxy_scatter.png'):
              assert (root/name).stat().st_size>8000
          PY
      - name: Generate real-HST planted-source recovery and forced-flux charts
        env:
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python -m stellarweave.injection_results \
            combined/spatial-transfer-*/artificial_stars.json \
            --out docs/results/real_injections_v14 \
            --run-id "$SOURCE_RUN_ID" --source-commit "$SOURCE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('docs/results/real_injections_v14')
          d=json.loads((root/'summary.json').read_text())
          assert d['total_trials']>0
          assert d['total_trials']==sum(c['attempted'] for c in d['clusters'])
          assert d['all_nondetections_retained'] is True
          assert d['physical_flux_units_calibrated'] is False
          assert len(d['groups'])==18
          for name in ('recovery_by_flux_crowding.png','forced_flux_error.png','paired_forced_flux_difference.png'):
              assert (root/name).stat().st_size>8000
          PY
      - name: Publish immutable-input real-data evidence to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/results/real_hst_v09 docs/results/real_hst_v12 docs/results/real_prf_v12 docs/results/real_prf_v13 docs/results/real_injections_v14
          if git diff --cached --quiet; then
            echo "No experiment evidence changed"
          else
            git commit -m "docs: archive reproducible HST spatial transfer figures and raw reports"
            git push origin HEAD:main
          fi
      - name: Store three-cluster summary
        uses: actions/upload-artifact@v4
        with:
          name: stellarweave-three-cluster-summary
          path: |
            cross_cluster_summary.json
            docs/results/real_hst_v09/
            docs/results/real_hst_v12/
            docs/results/real_prf_v12/
            docs/results/real_prf_v13/
            docs/results/real_injections_v14/
          retention-days: 30
