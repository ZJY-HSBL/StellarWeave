name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - name: Install smoke dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: End-to-end synthetic run
        run: python -m stellarweave.cli --detector scipy --size 128 --stars 15 --seed 42 --out outputs/ci
      - name: Verify artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path("outputs/ci/summary.json").read_text())
          assert s["mode"] == "SYNTHETIC_GAUSSIAN_PSF"
          assert s["metrics"]["true_sources"] == 15
          assert Path("outputs/ci/detections.png").is_file()
          PY

  science-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install astrophysics dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests including generated FITS/WCS
        run: python -m pytest -q
      - name: Verify artificial-star recovery CLI
        run: |
          python -m stellarweave.injection_cli --size 128 --trials 1 --per-flux 2 --flux-levels 800 2500 --out outputs/injection-ci
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('outputs/injection-ci')
          d=json.loads((p/'manifest.json').read_text())
          assert len(d['groups'])==8
          assert (p/'completeness.png').is_file()
          PY
      - name: Verify PSF baseline CLI (full astronomy environment)
        run: |
          python -m stellarweave.benchmark_cli --size 112 --trials 1 --per-flux 1 --flux-levels 1800 --methods dao psf iterative --out outputs/psf-ci
          python - <<'PY'
          import json
          from pathlib import Path
          o=Path('outputs/psf-ci')
          r=json.loads((o/'benchmark.json').read_text())
          assert len(r['groups']) == 12
          assert (o/'method_comparison.png').is_file()
          PY
      - name: Verify data preparation CLI
        run: |
          python -m stellarweave.prepare_hst --help
          python -m stellarweave.dualband --help
